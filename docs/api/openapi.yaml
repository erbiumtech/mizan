openapi: 3.1.0
info:
  title: Mizan API
  version: "1.0"
  description: >
    The JSON API for mobile and integration clients (docs/desktop-mobile-plan.md A2).
    Versioning (D4): every path is served under both /api (deprecated, kept for clients already in the
    field) and /api/v1; new work targets /v1. The one shape that differs is GET /my-mprs/comparison with
    no records, which is 404 under /v1 and 400 unprefixed.
    Envelope: every response carries a boolean success; a success adds the endpoint's own fields, an error
    adds message and sometimes extra fields such as errors or mfa_required (App\Http\ApiResponse).
    Auth: obtain a bearer token from POST /login (it carries the api ability and expires after
    SANCTUM_TOKEN_EXPIRATION minutes; refresh at POST /refresh) and send it as Authorization Bearer.
    Company: an account in one company is resolved automatically; an account in several must name one with
    the X-Company header or the request is 422.
    Error grammar - 401 no or bad credentials or a missing, expired or ability-less token or a required
    second factor; 403 the module is not licensed or MFA setup is required; 404 the record does not exist
    or is not the caller's; 422 validation failed or the account named no company among several; 429 rate
    limited (5/min on login per email and address, 90/min otherwise).
servers:
  - url: https://mizan.erbium.tech/api/v1
    description: Versioned surface
  - url: https://mizan.erbium.tech/api
    description: Unprefixed, deprecated
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Company:
      name: X-Company
      in: header
      required: false
      schema:
        type: string
      description: The company slug, required only for an account that belongs to more than one.
  schemas:
    Success:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    Error:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials or token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Module not licensed, or MFA setup required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such record for this caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validation failed, or the company is ambiguous.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited.
paths:
  /login:
    post:
      summary: Sign in and receive a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: string
                  maxLength: 100
                code:
                  type: string
                  description: TOTP or recovery code, required when the account enforces MFA.
      responses:
        '200':
          description: A bearer token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        const: Bearer
                      expires_at:
                        type: [string, 'null']
                      user:
                        type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /logout:
    post:
      summary: Revoke the current device token
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /refresh:
    post:
      summary: Replace the current token with a fresh one
      responses:
        '200':
          description: A new token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tokens:
    get:
      summary: List this account's devices
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tokens/{token}:
    delete:
      summary: Sign one device out
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /my-profile:
    get:
      summary: The signed-in employee's own profile
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /my-payslips:
    get:
      summary: The caller's own payslips
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Payslips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /my-payslips/{payslip}/pdf:
    get:
      summary: A payslip PDF the caller owns
      parameters:
        - name: payslip
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: The payslip PDF url.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payslips/{payslip}/comments:
    get:
      summary: Comments on a payslip the caller may view
      parameters:
        - name: payslip
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Add a comment to a payslip
      parameters:
        - name: payslip
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Company'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /my-leave-balances:
    get:
      summary: The caller's leave balances by type
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /my-leave-requests:
    post:
      summary: File leave for the signed-in employee
      parameters:
        - $ref: '#/components/parameters/Company'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [leave_type_id, from_date, to_date]
              properties:
                leave_type_id:
                  type: integer
                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
                is_half_day:
                  type: boolean
                half_day_period:
                  type: string
                  enum: [first, second]
                reason:
                  type: string
                  maxLength: 2000
                document:
                  type: string
                  format: binary
                  description: Required when the leave type demands one.
      responses:
        '201':
          description: Filed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /my-mprs:
    get:
      summary: The caller's own MPRs
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: MPRs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /my-mprs/comparison:
    get:
      summary: A comparison report across the caller's MPRs
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: The report url.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: No records to compare on this surface; the unprefixed route answers 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /my-mprs/{id}:
    get:
      summary: One MPR the caller owns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: MPR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /my-attendance/clock:
    post:
      summary: Clock in, or clock out, for the signed-in employee
      description: >-
        The first call of the day records a check-in, the second a check-out, a third is refused (422).
        Coordinates are optional and recorded as given; nothing judges them.
      parameters:
        - $ref: '#/components/parameters/Company'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                accuracy_m:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Clocked in
        '200':
          description: Clocked out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Already clocked in and out today

  # ---------------------------------------------------------------------------------------------
  # Backfilled by docs/project-management-plan.md Phase 9. `ApiContractTest` now holds this file to
  # the mounted routes in both directions, and its first run was an audit: the twelve paths below
  # were mounted and undocumented. Each is recorded at path-and-method level with the envelope; the
  # module that owns one fills in its shapes when it next touches the endpoint.
  # ---------------------------------------------------------------------------------------------
  /reports/trial-balance:
    get:
      summary: The trial balance as at a date (Accounting)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: The statement.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reports/profit-and-loss:
    get:
      summary: Profit and loss for a period (Accounting)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: The statement.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /accounts/tree:
    get:
      summary: The chart of accounts as a nested tree (Accounting)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Root accounts with children.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /accounts:
    get:
      summary: Accounts, filtered (Accounting)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: A page of accounts.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create an account (Accounting)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '201':
          description: The account.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation failed.
  /accounts/{account}:
    parameters:
      - name: account
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: One account with its parent, children and recent lines (Accounting)
      responses:
        '200':
          description: The account.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update an account (Accounting)
      responses:
        '200':
          description: The account.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation failed.
    patch:
      summary: Update an account (Accounting)
      responses:
        '200':
          description: The account.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete an account that has no lines (Accounting)
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The account has lines or children.
  /my-field-visits:
    get:
      summary: The signed-in rep's field visits (CRM)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Visits.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /field-visits/{visit}/check-in:
    post:
      summary: Check in at a visit (CRM)
      parameters:
        - name: visit
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Checked in.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Already checked in.
  /field-visits/{visit}/check-out:
    post:
      summary: Check out of a visit (CRM)
      parameters:
        - name: visit
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Checked out.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Not checked in.
  /my-tasks:
    get:
      summary: The signed-in employee's recurring tasks due (Performance)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Task occurrences.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /my-tasks/{occurrence}/complete:
    post:
      summary: Mark a task occurrence complete (Performance)
      parameters:
        - name: occurrence
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Completed.
        '404':
          $ref: '#/components/responses/NotFound'
  /my-daily-reports:
    get:
      summary: The signed-in employee's daily reports (Performance)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Reports.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: File today's daily report (Performance)
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '201':
          description: Filed.
        '422':
          description: Validation failed.

  # ---------------------------------------------------------------------------------------------
  # Work — docs/project-management-plan.md §11. Every route needs the `work` ability on the token
  # as well as `api`; a token without it is 403 on every path below. Items are addressed by key.
  # ---------------------------------------------------------------------------------------------
  /work/projects:
    get:
      summary: The projects the token's user may see, with key and open count
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            key: { type: string, nullable: true }
                            code: { type: string }
                            name: { type: string }
                            status: { type: string }
                            open_items: { type: integer }
                            active_sprint: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /work/projects/{key}/board:
    get:
      summary: The project's board — columns with their cards, in rank order
      description: The one call the board screen makes. Quick filters mine, unassigned, blocked and search compose with the board's own.
      parameters:
        - $ref: '#/components/parameters/Company'
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The project key, e.g. WEB.
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - { name: blocked, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Columns, each with lanes of cards.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /work/items:
    get:
      summary: Work items, filtered
      parameters:
        - $ref: '#/components/parameters/Company'
        - { name: project, in: query, schema: { type: string }, description: A project key. }
        - { name: status_category, in: query, schema: { type: string, enum: [todo, in_progress, done] } }
        - { name: assignee, in: query, schema: { type: string }, description: "`me`, or an employee id." }
        - { name: sprint, in: query, schema: { type: string }, description: "`active`, or a sprint id." }
        - { name: search, in: query, schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        '200':
          description: A page of items.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: File a work item
      description: A project key and a title are enough; everything else takes a default — the workflow's first status, the bottom of the backlog, nobody assigned.
      parameters:
        - $ref: '#/components/parameters/Company'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, title]
              properties:
                project: { type: string }
                title: { type: string, maxLength: 255 }
                description: { type: string }
                type: { type: string }
                priority: { type: string }
                assignee_employee_id: { type: integer }
                parent_id: { type: integer }
                sprint_id: { type: integer }
                release_id: { type: integer }
                estimate_points: { type: number }
                estimate_minutes: { type: integer }
                due_on: { type: string, format: date }
      responses:
        '201':
          description: The item, with its key.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation failed, or the hierarchy rule refused the parent.
  /work/items/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: The item key, e.g. WEB-12.
    get:
      summary: One work item, with its description and comments
      responses:
        '200':
          description: The item.
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update the fields of §3.2 by name
      description: Status is not among them — that is `move`, because a status change is a transition.
      responses:
        '200':
          description: The item.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation failed, or a model rule refused.
  /work/items/{key}/move:
    post:
      summary: Move an item to a status, with optional neighbours for rank
      description: The same moveTo() the board calls, the same workflow rules, the same refusals — as 422 with the reason.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { description: A status id or name of the item's workflow., oneOf: [{ type: integer }, { type: string }] }
                resolution: { type: string }
                after: { type: integer, description: The id of the card above. }
                before: { type: integer, description: The id of the card below. }
      responses:
        '200':
          description: The item, where it went.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: A workflow rule refused, with the reason — or the status is not one of the workflow's, with the list.
  /work/items/{key}/comments:
    post:
      summary: Comment on an item
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, description: Markdown. Mentions as @[Name](user:ID). }
      responses:
        '201':
          description: The comment.
        '404':
          $ref: '#/components/responses/NotFound'
  /work/items/{key}/time:
    post:
      summary: Log time on an item — one timesheet entry, nothing else
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 1440 }
                date: { type: string, format: date }
                note: { type: string }
                billable: { type: boolean }
      responses:
        '201':
          description: The entry.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No timesheet module, no linked employee, or more than a day.
  /work/my:
    get:
      summary: The "My work" board as data
      parameters:
        - $ref: '#/components/parameters/Company'
      responses:
        '200':
          description: Columns by category — to do, in progress, done this week — with the caller's items.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /devices:
    get:
      summary: The browsers and apps the caller has subscribed to push
      description: docs/desktop-mobile-plan.md A3. A device is the user's, so no company is resolved.
      responses:
        '200':
          description: Devices, newest use first; the push-service keys are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register this device for push
      description: >-
        The PushSubscription a browser returns from pushManager.subscribe(), as JSON. Posting the same
        endpoint again replaces the row (200) rather than adding a device (201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  format: uri
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                content_encoding:
                  type: string
                  enum: [aes128gcm, aesgcm]
                transport:
                  type: string
                  enum: [webpush]
      responses:
        '201':
          description: Registered.
        '200':
          description: Replaced.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
