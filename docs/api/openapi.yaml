  # ---------------------------------------------------------------------------------------------
  # Offline sync — docs/desktop-mobile-plan.md §5a, O1. One inbox for every workflow; attendance
  # punches are the first. A workflow's routes are mounted by the module that owns it, under that
  # module's licence, which is why the segment is a fixed word rather than a parameter here.
  # ---------------------------------------------------------------------------------------------
  /sync/attendance:
    post:
      summary: Replay attendance punches captured offline
      description: >-
        Versioned surface only. A batch of up to 100 commands, applied strictly in the order given, each in
        its own transaction. A command is a client-minted ULID, a payload and the device's captured_at;
        the ULID is the idempotency key: a command the server has seen answers from its record with status
        `replayed` and is not applied again, so a device may resend a batch the connection cut short. Per
        command the status is `applied` (result is the attendance day), `rejected` (422; the recorder
        refused it for a reason that will hold — a third punch, a day on approved leave — and the refusal is
        recorded), `conflict` (409; another account already sent this id), `failed` (500; ours, not
        recorded, retry later; everything after it in the batch is `skipped`). The device's clock is
        recorded and never used to order anything; received_at is canonical. A punch's payload is
        `type: punch`, `punched_at` (the moment, ISO 8601), optional `latitude`/`longitude`/`accuracy_m`
        and `note`. The punch is the caller's own employee record; the earlier moment of a day's two
        punches is the check-in whichever arrives first; a punch within a minute of the check-in is the same
        tap twice and changes nothing.
      parameters:
        - $ref: '#/components/parameters/Company'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commands]
              properties:
                commands:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [id, payload]
                    properties:
                      id:
                        type: string
                        description: A ULID minted on the device, 26 Crockford base32 characters.
                      captured_at:
                        type: string
                        format: date-time
                      payload:
                        type: object
                        required: [type, punched_at]
                        properties:
                          type:
                            type: string
                            enum: [punch]
                          punched_at:
                            type: string
                            format: date-time
                          latitude:
                            type: number
                          longitude:
                            type: number
                          accuracy_m:
                            type: integer
                          note:
                            type: string
                            maxLength: 255
      responses:
        '200':
          description: The batch was received; see each command's status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum: [applied, replayed, rejected, conflict, failed, skipped]
                        http_status:
                          type: integer
                          nullable: true
                          description: Null for `skipped`, which no status was produced for.
                        captured_at:
                          type: string
                          nullable: true
                        received_at:
                          type: string
                          nullable: true
                          description: Null for `skipped`, which the server never reached.
                        result:
                          type: object
                          nullable: true
                  summary:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /sync/attendance/changes:
    get:
      summary: Attendance days changed since a cursor
      description: >-
        Versioned surface only. The incremental read of the sync engine: the caller's attendance days —
        their own, their reports' if they manage people, everyone's for a privileged role — in updated_at
        order, strictly after the cursor. `since` is the cursor the previous page returned (opaque; absent
        or unreadable means from the start), `limit` the page size (default 200, at most 500). `cursor` in
        the answer is what to send next time, `has_more` says to come straight back. `deleted` is always
        empty for attendance: a day is corrected or pruned, never soft-deleted.
      parameters:
        - $ref: '#/components/parameters/Company'
        - name: since
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  deleted:
                    type: array
                    items:
                      type: integer
                  cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
