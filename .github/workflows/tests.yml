name: Laravel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# A new push to a pull request cancels the run it supersedes: nobody acts on a
# result for a commit the branch has moved past.
#
# Master is different. Every merge is a push, so cancelling there meant a
# morning of merges never finished a single run: each one killed the last,
# shards forty minutes in. On master a running suite now always finishes.
# GitHub keeps one run waiting behind it per group, and a newer merge replaces
# that waiting one, so a burst of merges costs one finished run plus one run of
# the newest commit, not one run per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
    - uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
      with:
        php-version: '8.4'
    - uses: actions/checkout@v7
    - uses: actions/cache@v4
      with:
        path: ~/.cache/composer/files
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    # Its own job, so a style failure reports in a minute instead of at the end
    # of a run that never gets to the tests.
    - name: Check code style (Pint)
      run: vendor/bin/pint --test

  tests:
    name: tests (${{ matrix.php }}, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json requires php ^8.4, so 8.3 cannot honestly be in the
        # matrix — it only ever installed because config.platform pins 8.4.
        # Add 8.5 here when it exists and composer.json allows it.
        php: [ '8.4' ]
        # The suite passed 5,800 tests and two hours of wall clock on one runner,
        # even four processes wide. Each shard is a quarter of the test files,
        # dealt by .github/scripts/shard-tests.php, and the shards run at once.
        # Change the 4 here, in the shard step and in the job name together.
        shard: [ 1, 2, 3, 4 ]

    steps:
    - uses: shivammathur/setup-php@3bdfe21000ea9539e3a94c4f692f984b24fa97e0
      with:
        php-version: '${{ matrix.php }}'
    - uses: actions/checkout@v7
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/composer/files
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Pick this runner's shard of the suite
      run: php .github/scripts/shard-tests.php ${{ matrix.shard }} 4
    # No `env:` block here, deliberately. phpunit.xml already pins the landlord
    # and tenant connections, and it pins them so the suite cannot depend on
    # whose machine — or which runner — it happens to run on.
    #
    # Setting DB_DATABASE here defeated that. PHPUnit's <env> does not overwrite
    # a variable the process already has, so a real environment variable from a
    # workflow step wins over the pin, and the whole suite ran against a shared
    # file instead of :memory:. TestEnvironmentTest exists to catch exactly that
    # and was the one failure that told the truth.
    # In parallel, one process per core (ParaTest reads the count): the serial suite took three
    # hours and fifty minutes on this runner against twenty-nine on a twelve-core laptop. The
    # database is in memory per process already; tests/TestCase.php gives each process its own
    # storage directory (uploads, compiled views, logs), and ModuleManifest writes its cache
    # atomically — the two pieces of shared state the suite had.
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      run: php artisan test --parallel

  # One check with the name branch protection already requires, green only when
  # style and every shard are. `if: always()` is what makes it run — and fail —
  # when a shard fails instead of being skipped along with it.
  laravel-tests:
    name: laravel-tests (8.4)
    needs: [ style, tests ]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any job did
      run: |
        echo "style: ${{ needs.style.result }}"
        echo "tests: ${{ needs.tests.result }}"
        test "${{ needs.style.result }}" = "success" && test "${{ needs.tests.result }}" = "success"
