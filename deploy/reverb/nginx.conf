# Terminates TLS and proxies the WebSocket upgrade through to Reverb, which
# binds only to 127.0.0.1:8080 (see reverb.service). Replace ws.mpr.example
# with the real hostname and point REVERB_HOST / VITE_REVERB_HOST at it from
# the main app's .env once this is live.

server {
    listen 80;
    server_name ws.mpr.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ws.mpr.example;

    ssl_certificate     /etc/letsencrypt/live/ws.mpr.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.mpr.example/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — Reverb's connection is long-lived, so the
        # default proxy_read_timeout would drop idle sockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
