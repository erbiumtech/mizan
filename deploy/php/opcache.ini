; OPcache, as this application wants it in production.
;
; Install as a PHP-FPM ini fragment — the path varies by distribution; on Debian
; and Ubuntu it is:
;
;     sudo cp deploy/php/opcache.ini /etc/php/8.3/fpm/conf.d/99-mpr-opcache.ini
;     sudo systemctl restart php8.3-fpm
;
; Confirm it took with `php -i | grep opcache.enable` on the FPM SAPI (not the
; CLI, which has its own ini and does not matter here).
;
; See docs/page-load-performance-plan.md.

opcache.enable=1

; Enough for the framework, Filament and this application's own classes with
; room to spare. Too small and OPcache evicts, which is worse than being off:
; every eviction is a re-compile.
opcache.memory_consumption=256
opcache.interned_strings_buffer=16

; The number of *files* it will hold, not classes. `find app vendor -name '*.php' | wc -l`
; on this codebase is well over 10,000; this leaves headroom for growth.
opcache.max_accelerated_files=20000

; Do not stat every file on every request looking for changes. This is the
; setting that matters most and the one with teeth: with it on, PHP keeps
; serving the code it compiled at the last restart, so a deploy that does not
; restart PHP-FPM appears to have done nothing at all. deploy/deploy.sh ends by
; telling you to reload FPM for exactly this reason.
opcache.validate_timestamps=0

; Compile-time only. `save_comments=0` would be faster still and is not an
; option here: Laravel and Filament read docblock annotations at runtime.
opcache.save_comments=1
