# nginx: compression and asset caching for the app server.
#
# Include from the app's `server { }` block:
#
#     include /etc/nginx/snippets/mpr-assets.conf;
#
# Two things, both of which the application cannot do for itself.
#
# **Compression.** The admin panel's stylesheet is ~650KB and its JavaScript
# ~250KB before gzip and around a tenth of that after. Uncompressed, the first
# visit spends most of its time transferring text.
#
# **Cache headers.** Every asset URL below is content-addressed — Vite hashes
# the filename (`app-BOpC7FD1.css`) and Filament versions its own — so a stale
# copy is impossible by construction and the browser can be told to keep them.
# Without this the panel re-validates a dozen files on every visit, which soft
# navigation makes more noticeable rather than less: the document no longer
# reloads, so a revalidation round trip is the only thing left to wait for.
#
# See docs/page-load-performance-plan.md.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# If the brotli module is available it is worth roughly another 15% on this
# payload; uncomment together with the module.
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# Vite's build output: the hash is in the filename.
location /build/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Filament's published assets. Versioned by query string rather than by
# filename, so they are given a year with revalidation rather than `immutable`.
location ~ ^/(js|css)/filament/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000";
    try_files $uri =404;
}

location ~ ^/(fonts|images)/ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

# Deliberately absent: anything under /files/. Company uploads are streamed by
# TenantFileController, which checks membership first — serving them off disk
# here would hand every payslip to anyone who knows a path.
